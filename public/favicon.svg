<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="75%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#141936" />
      <stop offset="50%" stop-color="#0B0D1E" />
      <stop offset="100%" stop-color="#04050C" />
    </radialGradient>

    <!-- Glowing Cyan Line Gradient -->
    <linearGradient id="cyanNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>

    <!-- Glowing Purple Line Gradient -->
    <linearGradient id="purpleNeon" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7F00FF" />
      <stop offset="100%" stop-color="#E100FF" />
    </linearGradient>

    <!-- Star Gold/Amber Gradient -->
    <radialGradient id="goldStar" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF5C0" />
      <stop offset="40%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#FF8C00" />
    </radialGradient>

    <!-- Star Cyan Glow Gradient -->
    <radialGradient id="cyanStar" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#0066FF" />
    </radialGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="intenseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Neon Circuit Ring (AI Theme) -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#purpleNeon)" stroke-width="3" opacity="0.4" stroke-dasharray="12 8 4 8" />
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#cyanNeon)" stroke-width="2" opacity="0.6" stroke-dasharray="40 15 10 15" />

  <!-- Neural Orbit Rings -->
  <ellipse cx="256" cy="256" rx="170" ry="80" fill="none" stroke="url(#cyanNeon)" stroke-width="2" opacity="0.35" transform="rotate(-30 256 256)" />
  <ellipse cx="256" cy="256" rx="170" ry="80" fill="none" stroke="url(#purpleNeon)" stroke-width="2" opacity="0.35" transform="rotate(45 256 256)" />

  <!-- Orion Constellation & AI Neural Network Lines -->
  <g filter="url(#neonGlow)">
    <!-- Main Constellation Lines -->
    <!-- Betelgeuse (170, 130) to Bellatrix (342, 145) -->
    <line x1="170" y1="130" x2="342" y2="145" stroke="url(#cyanNeon)" stroke-width="4" opacity="0.85" />
    
    <!-- Betelgeuse (170, 130) to Alnitak (210, 260) -->
    <line x1="170" y1="130" x2="210" y2="260" stroke="url(#purpleNeon)" stroke-width="3.5" opacity="0.8" />
    
    <!-- Bellatrix (342, 145) to Mintaka (302, 252) -->
    <line x1="342" y1="145" x2="302" y2="252" stroke="url(#cyanNeon)" stroke-width="3.5" opacity="0.8" />

    <!-- Orion's Belt: Alnitak (210, 260) -> Alnilam (256, 256) -> Mintaka (302, 252) -->
    <line x1="210" y1="260" x2="256" y2="256" stroke="#00F2FE" stroke-width="6" stroke-linecap="round" />
    <line x1="256" y1="256" x2="302" y2="252" stroke="#00F2FE" stroke-width="6" stroke-linecap="round" />

    <!-- Belt to Saiph & Rigel -->
    <!-- Alnitak (210, 260) to Saiph (185, 385) -->
    <line x1="210" y1="260" x2="185" y2="385" stroke="url(#cyanNeon)" stroke-width="3.5" opacity="0.8" />

    <!-- Mintaka (302, 252) to Rigel (335, 375) -->
    <line x1="302" y1="252" x2="335" y2="375" stroke="url(#purpleNeon)" stroke-width="4" opacity="0.85" />

    <!-- Saiph (185, 385) to Rigel (335, 375) -->
    <line x1="185" y1="385" x2="335" y2="375" stroke="url(#cyanNeon)" stroke-width="4" opacity="0.85" />

    <!-- AI Neural Interconnections (Brain Synapses) -->
    <path d="M 170 130 Q 256 170 342 145" fill="none" stroke="url(#cyanNeon)" stroke-width="2" stroke-dasharray="6 4" opacity="0.6" />
    <path d="M 185 385 Q 256 310 335 375" fill="none" stroke="url(#purpleNeon)" stroke-width="2" stroke-dasharray="6 4" opacity="0.6" />
    <line x1="256" y1="256" x2="256" y2="1375" stroke="url(#cyanNeon)" stroke-width="1.5" opacity="0.3" />
  </g>

  <!-- Central AI Core Pulse (Around Orion Belt Center - Alnilam) -->
  <circle cx="256" cy="256" r="45" fill="#00F2FE" opacity="0.15" filter="url(#intenseGlow)" />
  <circle cx="256" cy="256" r="28" fill="none" stroke="#00F2FE" stroke-width="2.5" opacity="0.8" stroke-dasharray="8 4" />

  <!-- Constellation Star Nodes -->
  
  <!-- Betelgeuse (Red/Gold Supergiant Top-Left) -->
  <g transform="translate(170, 130)" filter="url(#intenseGlow)">
    <circle r="22" fill="url(#goldStar)" opacity="0.3" />
    <circle r="12" fill="url(#goldStar)" />
    <circle r="5" fill="#FFFFFF" />
  </g>

  <!-- Rigel (Blue-White Supergiant Bottom-Right) -->
  <g transform="translate(335, 375)" filter="url(#intenseGlow)">
    <circle r="24" fill="url(#cyanStar)" opacity="0.3" />
    <circle r="13" fill="url(#cyanStar)" />
    <circle r="6" fill="#FFFFFF" />
  </g>

  <!-- Bellatrix (Top-Right) -->
  <g transform="translate(342, 145)" filter="url(#neonGlow)">
    <circle r="14" fill="url(#cyanStar)" opacity="0.3" />
    <circle r="8" fill="url(#cyanStar)" />
  </g>

  <!-- Saiph (Bottom-Left) -->
  <g transform="translate(185, 385)" filter="url(#neonGlow)">
    <circle r="14" fill="url(#cyanStar)" opacity="0.3" />
    <circle r="8" fill="url(#cyanStar)" />
  </g>

  <!-- Orion's Belt Stars (Alnitak, Alnilam, Mintaka) -->
  <!-- Alnitak -->
  <g transform="translate(210, 260)" filter="url(#neonGlow)">
    <circle r="16" fill="url(#cyanStar)" opacity="0.4" />
    <circle r="9" fill="#00F2FE" />
    <circle r="4" fill="#FFFFFF" />
  </g>

  <!-- Alnilam (Center Belt Star & AI Core Node) -->
  <g transform="translate(256, 256)" filter="url(#intenseGlow)">
    <circle r="20" fill="url(#cyanStar)" opacity="0.5" />
    <circle r="11" fill="#FFFFFF" />
    <!-- AI Core Symbol Crosshair -->
    <path d="M -16 0 L 16 0 M 0 -16 L 0 16" stroke="#00F2FE" stroke-width="2" />
  </g>

  <!-- Mintaka -->
  <g transform="translate(302, 252)" filter="url(#neonGlow)">
    <circle r="16" fill="url(#cyanStar)" opacity="0.4" />
    <circle r="9" fill="#00F2FE" />
    <circle r="4" fill="#FFFFFF" />
  </g>

  <!-- Background Tiny Sparkles / AI Micro-nodes -->
  <circle cx="120" cy="210" r="3" fill="#00F2FE" opacity="0.7" filter="url(#neonGlow)" />
  <circle cx="390" cy="270" r="2.5" fill="#E100FF" opacity="0.7" filter="url(#neonGlow)" />
  <circle cx="280" cy="90" r="3" fill="#FFD700" opacity="0.8" filter="url(#neonGlow)" />
  <circle cx="220" cy="430" r="2" fill="#00F2FE" opacity="0.6" />
  <circle cx="410" cy="190" r="2" fill="#00F2FE" opacity="0.5" />
  <circle cx="100" cy="330" r="2.5" fill="#7F00FF" opacity="0.6" />

  <!-- Subtle AI Node Connections (Dotted to Background Stars) -->
  <line x1="170" y1="130" x2="120" y2="210" stroke="#00F2FE" stroke-width="1" stroke-dasharray="3 3" opacity="0.4" />
  <line x1="342" y1="145" x2="390" y2="270" stroke="#E100FF" stroke-width="1" stroke-dasharray="3 3" opacity="0.4" />
  <line x1="342" y1="145" x2="280" y2="90" stroke="#FFD700" stroke-width="1" stroke-dasharray="3 3" opacity="0.4" />
</svg>
